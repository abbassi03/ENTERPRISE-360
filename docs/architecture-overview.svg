<text x="352" y="174" fill="#7562dc" font-size="11" font-weight="700" letter-spacing="1.5">02 · APPLICATION</text><text x="352" y="214" fill="#1e2a47" font-size="23" font-weight="700">Django</text><text x="352" y="248" fill="#71809b" font-size="13">Authentication & forms</text><text x="352" y="272" fill="#71809b" font-size="13">Server-side validation</text><text x="352" y="296" fill="#71809b" font-size="13">Protected business views</text><text x="352" y="338" fill="#9aa4b5" font-size="10">URL routing · ORM · Admin</text>
